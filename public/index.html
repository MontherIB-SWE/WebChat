<!DOCTYPE html>
<html>
<head>
  <title>Firebase Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>
  
  <!-- Firebase config file -->
  <script src="firebase-config.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #282828 100%);
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(34, 34, 34, 0.95);
      padding: 30px 25px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      width: 90%;
      max-width: 320px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .container h1 {
      margin-bottom: 20px;
      font-size: 1.4em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 3px;
      border: 1px solid #666;
      background-color: #333;
      color: #eee;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #2e7d32;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      background: linear-gradient(135deg, #027a0d, #025815);
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
    }
    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    a {
      color: #007bff;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    a:hover {
      color: #005bb5;
      text-decoration: underline;
    }

    p {
      margin-top: 20px;
      font-size: 0.9em;
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="auth-container" class="container">
    <!-- Sign In Form -->
    <div id="sign-in">
      <h1>Sign In</h1>
      <input type="email" id="signin-email" placeholder="Email">
      <input type="password" id="signin-password" placeholder="Password">
      <button id="signin-btn">Sign In</button>
      <p>Don't have an account? <a id="go-signup">Sign Up</a></p>
    </div>

    <!-- Sign Up Form -->
    <div id="sign-up" style="display: none;">
      <h1>Sign Up</h1>
      <input type="text" id="signup-name" placeholder="Your Name">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password">
      <button id="signup-btn">Sign Up</button>
      <p>Already have an account? <a id="go-signin">Sign In</a></p>
    </div>
  </div>

  <script>
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();

    document.getElementById("go-signup").addEventListener("click", () => {
      document.getElementById("sign-in").style.display = "none";
      document.getElementById("sign-up").style.display = "block";
    });
    document.getElementById("go-signin").addEventListener("click", () => {
      document.getElementById("sign-up").style.display = "none";
      document.getElementById("sign-in").style.display = "block";
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      
      if (!name) {
        alert("Please enter your name.");
        return;
      }
      
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(email).set({
          name: name,
          email: email,
          friends: []
        });
        alert("Sign up successful! Please sign in.");
        document.getElementById("sign-up").style.display = "none";
        document.getElementById("sign-in").style.display = "block";
      } catch (error) {
        alert("Error during sign up: " + error.message);
      }
    });

    document.getElementById("signin-btn").addEventListener("click", async () => {
      const email = document.getElementById("signin-email").value;
      const password = document.getElementById("signin-password").value;
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        sessionStorage.setItem('username', userCredential.user.email);
        sessionStorage.setItem('token', 'authenticated');
        
        const authContainer = document.getElementById("auth-container");
        authContainer.classList.add("fade-out");
        
        authContainer.addEventListener("transitionend", () => {
          window.location.href = "homescreen.html";
        });
        
      } catch (error) {
        alert("Error during sign in: " + error.message);
      }
    });
  </script>
</body>
</html>
