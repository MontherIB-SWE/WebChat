<!DOCTYPE html>
<html>
<head>
  <title>Chat & Game Challenges</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>

  <style>
    /* Global Reset and Basic Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #282828 100%);
      color: #eee;
      overflow: hidden;
      position: relative;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body, #main-content, #sidebar, #modal-overlay {
      transition: all 0.3s ease;
    }
    #toggle-sidebar {
      background: none;
      border: none;
      font-size: 20px;
      color: #eee;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s;
    }
    #toggle-sidebar:hover {
      transform: scale(1.1);
    }
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 110;
      display: none;
    }
    #modal-overlay.active {
      display: block;
    }
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background-color: rgba(34,34,34,0.95);
      box-shadow: 4px 0 6px rgba(0,0,0,0.5);
      padding: 20px;
      transform: translateX(-260px);
      z-index: 130;
      backdrop-filter: blur(3px);
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #sidebar h2 {
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.6em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #close-sidebar {
      background: none;
      border: none;
      color: #eee;
      font-size: 24px;
      cursor: pointer;
      margin-bottom: 20px;
      outline: none;
    }
    #close-sidebar:hover {
      color: #ccc;
    }
    #sidebar button {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 3px;
      background: linear-gradient(135deg, #027a0d, #025815);
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
    }
    #sidebar button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
    #main-content {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: row;
      padding: 20px;
      gap: 15px;
      transition: filter 0.3s ease;
    }
    #main-content.dimmed {
      filter: brightness(0.6);
    }
    #friends-container {
      flex: 1;
      background-color: rgba(42,42,42,0.85);
      border: 1px solid #444;
      border-radius: 8px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .friends-header {
      display: flex;
      align-items: center;
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px 8px 0 0;
    }
    .friends-header h2 {
      margin: 0;
      margin-left: 10px;
      font-size: 1.3em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
    }
    #friends-display {
      list-style: none;
      padding: 15px;
    }
    #friends-display li {
      padding: 12px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #555, #404040);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    #friends-display li:hover {
      background: linear-gradient(135deg, #666, #505050);
      transform: translateX(3px);
    }
    #no-friends-message {
      display: block;
      text-align: center;
      color: #aaa;
      margin: 20px auto;
    }
    #chat-container {
      flex: 2;
      background-color: rgba(51,51,51,0.8);
      border: 1px solid #444;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #chat-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.3em;
      color: #777;
      text-align: center;
      padding: 20px;
    }
    #chat-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .message {
      transition: transform 0.3s ease, opacity 0.3s ease;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      max-width: 75%;
      background-color: #555;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
      word-wrap: break-word;
      line-height: 1.4em;
    }
    .message.sent {
      margin-right: 0;
      margin-left: auto;
      background-color: #2e7d32;
      align-self: flex-end;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInFromBottom {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .new-message {
      animation: slideInFromBottom 0.5s ease-out;
      animation-fill-mode: forwards;
    }
    #chat-input {
      display: none;
      padding: 10px;
      border-top: 1px solid #444;
      background-color: #222;
      border-radius: 0 0 8px 8px;
      align-items: center;
    }
    #chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #666;
      border-radius: 3px;
      background-color: #333;
      color: #eee;
      margin-right: 10px;
      outline: none;
    }
    #chat-input input:focus {
      border-color: #2e7d32;
    }
    #chat-input button {
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
    }
    #chat-input button:hover {
      background-color: #005bb5;
      transform: translateY(-2px);
    }
    #challenge {
      margin-left: 10px;
      background-color: #ef5350;
    }
    #challenge:hover {
      background-color: #d32f2f;
      transform: translateY(-2px);
    }
    .modal-card {
      background-color: rgba(34,34,34,0.98);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      color: #fff;
      z-index: 130;
      display: none;
      width: 400px;
      max-width: 90%;
      text-align: center;
    }
    .modal-card h3 {
      margin-bottom: 20px;
      font-size: 1.6em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .modal-card label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .modal-card input {
      width: 100%;
      padding: 10px;
      border: 1px solid #666;
      border-radius: 4px;
      background-color: #333;
      color: #eee;
      margin-bottom: 20px;
      outline: none;
    }
    .button-group {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }
    .button-group button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
    }
    .button-group button:hover {
      background-color: #005bb5;
      transform: translateY(-2px);
    }
    #message-container,
    #requests-container,
    #game-requests-container,
    #game-select-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #request-list, #game-request-list {
      list-style: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      margin: 15px 0;
    }
    #game-request-list {
      padding: 0 15px;
    }
    #game-request-list li {
      padding: 12px 15px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #333, #444);
      border-radius: 8px;
      display: flex;
      align-items: center;
      transition: transform 0.2s, background 0.2s;
      position: relative;
    }
    #game-request-list li:hover {
      transform: translateX(5px);
      background: linear-gradient(135deg, #444, #555);
    }
    #game-request-list li button {
      padding: 5px 10px;
      border: none;
      border-radius: 3px;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
      margin-left: 5px;
    }
    #game-request-list li button:first-of-type {
      background-color: #2e7d32;
    }
    #game-request-list li button:first-of-type:hover {
      background-color: #1e5e24;
    }
    #game-request-list li button:last-of-type {
      background-color: #d32f2f;
    }
    #game-request-list li button:last-of-type:hover {
      background-color: #b71c1c;
    }
    #request-list li {
      padding: 10px;
      margin-bottom: 10px;
      background-color: #444;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, transform 0.2s;
    }
    #request-list li:hover {
      background-color: #555;
      transform: translateX(3px);
    }
    #request-list li button {
      padding: 5px 10px;
      border: none;
      border-radius: 3px;
      background-color: #0288d1;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      outline: none;
    }
    #request-list li button:hover {
      background-color: #02669b;
      transform: scale(1.05);
    }
    #game-select-modal {
      width: 400px;
      max-width: 90%;
      padding: 40px 30px;
    }
    #game-select-modal h3 {
      margin-bottom: 20px;
      font-size: 1.6em;
    }
    .game-options {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin-bottom: 20px;
    }
    .game-option {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #027a0d, #025815);
      color: #fff;
      font-size: 1.2em;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .game-option:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #037c1e, #025815);
    }
    .game-option .game-icon {
      font-size: 2em;
      margin-bottom: 5px;
    }
    #cancel-game-select {
      padding: 10px 20px;
      font-size: 1em;
      background: #444;
      border: none;
      border-radius: 4px;
      color: #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    #cancel-game-select:hover {
      background: #555;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
    
    /* Mobile responsiveness adjustments */
    @media (max-width: 600px) {
      #main-content {
        flex-direction: column;
      }
      #sidebar {
        width: 200px;
      }
      .friends-header h2 {
        font-size: 1.2em;
      }
      #chat-input input, #chat-input button {
        font-size: 0.9em;
        padding: 8px;
      }
      .modal-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar" class="closed">
    <button id="close-sidebar">&times; Close</button>
    <h2>Menu</h2>
    <button id="profile-btn">Profile</button>
    <button id="add-friends-sidebar">Add Friends</button>
    <button id="friend-requests-btn">Friend Requests</button>
    <button id="game-requests-btn">Game Requests</button>
    <button id="logout">Logout</button>
  </div>

  <!-- Main content area -->
  <div id="main-content">
    <!-- Friends list -->
    <div id="friends-container">
      <div class="friends-header">
        <button id="toggle-sidebar">&#9776;</button>
        <h2>Friends List</h2>
      </div>
      <ul id="friends-display"></ul>
      <span id="no-friends-message"></span>
    </div>

    <!-- Chat area -->
    <div id="chat-container">
      <div id="chat-placeholder">No chat selected</div>
      <div id="chat-messages"></div>
      <div id="chat-input">
        <input id="message" type="text" placeholder="Enter message">
        <button id="send">Send</button>
        <button id="challenge" style="display: none; margin-left: 10px;">Challenge</button>
      </div>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay"></div>

  <!-- Modal for adding friend -->
  <div id="message-container" class="modal-card">
    <form>
      <h3>Add Friend</h3>
      <label for="friend-email">Email:</label>
      <input type="email" id="friend-email" name="friend-email" required autocomplete="off">
      <div class="button-group">
        <button id="add">Send Request</button>
        <button id="close">Close</button>
      </div>
    </form>
  </div>

  <!-- Modal for viewing friend requests -->
  <div id="requests-container" class="modal-card">
    <h3>Friend Requests</h3>
    <ul id="request-list"></ul>
    <div class="button-group">
      <button id="close-requests">Close</button>
    </div>
  </div>

  <!-- Modal for viewing game requests -->
  <div id="game-requests-container" class="modal-card">
    <h3>Game Requests</h3>
    <ul id="game-request-list"></ul>
    <div class="button-group">
      <button id="close-game-requests">Close</button>
    </div>
  </div>

  <!-- Modal for game selection -->
  <div id="game-select-modal" class="modal-card">
    <h3>Select a Game</h3>
    <div class="game-options">
      <button class="game-option" data-game="Ping Pong">
        <span class="game-icon">🏓</span>
        <span class="game-name">Ping Pong</span>
      </button>
      <button class="game-option" data-game="Chess">
        <span class="game-icon">♟️</span>
        <span class="game-name">Chess</span>
      </button>
    </div>
    <button id="cancel-game-select">Cancel</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAfIXmgq8FAXC4nQeErSCkEqn7vBbFCh_E",
      authDomain: "webchat-1185b.firebaseapp.com",
      projectId: "webchat-1185b",
      storageBucket: "webchat-1185b.firebasestorage.app",
      messagingSenderId: "278191013540",
      appId: "1:278191013540:web:124f7fd4803ad2208e3031",
      measurementId: "G-J3YX8ETG88"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUsername = '';
    let targetUser = '';
    let chatListenerUnsubscribe = null;

    const toggleBtn = document.getElementById('toggle-sidebar');
    const sidebar = document.getElementById('sidebar');
    const modalOverlay = document.getElementById('modal-overlay');
    const mainContent = document.getElementById('main-content');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      if (sidebar.classList.contains('open')) {
        modalOverlay.classList.add('active');
        mainContent.classList.add('dimmed');
      } else {
        modalOverlay.classList.remove('active');
        mainContent.classList.remove('dimmed');
      }
    });

    document.getElementById('close-sidebar').addEventListener('click', () => {
      sidebar.classList.remove('open');
      modalOverlay.classList.remove('active');
      mainContent.classList.remove('dimmed');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const username = sessionStorage.getItem('username');
      const token = sessionStorage.getItem('token');
      if (!username || !token) {
        window.location.href = 'index.html';
      } else {
        currentUsername = username.trim().toLowerCase();
        db.collection("users").doc(currentUsername).get()
          .then(doc => {
            if (doc.exists && doc.data().name) {
              document.getElementById('profile-btn').innerText = doc.data().name;
            } else {
              document.getElementById('profile-btn').innerText = currentUsername;
            }
          })
          .catch(error => {
            console.error("Error fetching user name:", error);
            document.getElementById('profile-btn').innerText = currentUsername;
          });
        loadFriendsList(currentUsername);
      }
    });

    function loadFriendsList(username) {
      db.collection("users").doc(username).get()
        .then(doc => {
          if (doc.exists) {
            const friendsEmails = doc.data().friends || [];
            const friendsDisplay = document.getElementById('friends-display');
            const noFriendsMessage = document.getElementById('no-friends-message');
            friendsDisplay.innerHTML = '';
            if (friendsEmails.length > 0) {
              Promise.all(
                friendsEmails.map(email => db.collection("users").doc(email).get())
              ).then(friendDocs => {
                friendDocs.forEach(friendDoc => {
                  const friendName = (friendDoc.exists && friendDoc.data().name)
                    ? friendDoc.data().name
                    : friendDoc.id;
                  const li = document.createElement('li');
                  li.textContent = friendName;
                  li.addEventListener('click', () => selectChat(friendDoc.id));
                  friendsDisplay.appendChild(li);
                });
                noFriendsMessage.style.display = 'none';
                friendsDisplay.style.display = 'block';
              }).catch(error => {
                console.error("Error loading friend names:", error);
              });
            } else {
              noFriendsMessage.textContent = "You have no friends yet.";
              friendsDisplay.style.display = 'none';
            }
          } else {
            console.error("No user document found for", username);
          }
        })
        .catch(error => console.error("Error loading friends:", error));
    }

    function selectChat(friend) {
      targetUser = friend;
      const chatMessages = document.getElementById('chat-messages');
      const chatPlaceholder = document.getElementById('chat-placeholder');
      const chatInput = document.getElementById('chat-input');
      chatPlaceholder.style.display = 'none';
      chatMessages.style.display = 'flex';
      chatInput.style.display = 'flex';
      chatMessages.innerHTML = '';
      document.getElementById('game-requests-container').style.display = 'none';
      document.getElementById('challenge').style.display = 'inline-block';

      if (chatListenerUnsubscribe) {
        chatListenerUnsubscribe();
      }

      chatListenerUnsubscribe = db.collection("messages")
        .where("participants", "array-contains", currentUsername)
        .orderBy("timestamp")
        .onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === "added") {
              const msgData = change.doc.data();
              if (
                (msgData.sender === currentUsername && msgData.recipient === targetUser) ||
                (msgData.sender === targetUser && msgData.recipient === currentUsername)
              ) {
                addNewMessageToChat(msgData.sender, msgData.content, change.doc.id);
              }
            }
          });
        }, error => {
          console.error("Error fetching chat messages:", error);
        });
    }

    function addNewMessageToChat(sender, content, messageId) {
      const chatMessages = document.getElementById('chat-messages');
      const messageElement = document.createElement('div');
      messageElement.classList.add('message');
      if (sender === currentUsername) messageElement.classList.add('sent');
      messageElement.classList.add('new-message');

      const senderElement = document.createElement('strong');
      senderElement.textContent = sender === currentUsername ? "You: " : sender + ": ";

      const contentElement = document.createElement('p');
      contentElement.textContent = content;

      messageElement.appendChild(senderElement);
      messageElement.appendChild(contentElement);

      chatMessages.appendChild(messageElement);
      setTimeout(() => {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      }, 50);
      setTimeout(() => {
        messageElement.classList.remove('new-message');
      }, 500);
    }

    document.getElementById('send').addEventListener('click', (event) => {
      event.preventDefault();
      const messageInput = document.getElementById('message');
      const messageContent = messageInput.value.trim();
      if (messageContent === '') return;
      db.collection("messages").add({
          sender: currentUsername,
          recipient: targetUser,
          content: messageContent,
          participants: [currentUsername, targetUser],
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        messageInput.value = '';
      })
      .catch(error => console.error("Error sending message:", error));
    });

    document.getElementById('message').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('send').click();
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.clear();
      auth.signOut()
        .then(() => window.location.href = 'index.html')
        .catch(error => console.error("Logout failed:", error));
    });

    document.getElementById('add-friends-sidebar').addEventListener('click', () => {
      sidebar.classList.remove('open');
      mainContent.classList.remove('dimmed');
      document.getElementById('message-container').style.display = 'block';
      modalOverlay.classList.add('active');
    });

    document.getElementById('close').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('message-container').style.display = 'none';
      modalOverlay.classList.remove('active');
    });

    document.getElementById('add').addEventListener('click', (event) => {
      event.preventDefault();
      const friendEmail = document.getElementById('friend-email').value.trim().toLowerCase();
      if (!friendEmail) {
        alert('Please enter an email to add.');
        return;
      }
      db.collection("users").doc(friendEmail).get()
        .then(doc => {
          if (doc.exists) {
            db.collection("friendRequests").add({
              sender: currentUsername,
              recipient: friendEmail,
              status: "pending",
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
              alert("Friend request sent successfully!");
              document.getElementById('message-container').style.display = 'none';
              modalOverlay.classList.remove('active');
            })
            .catch(error => {
              console.error("Error sending friend request:", error);
              alert("Error sending friend request: " + error.message);
            });
          } else {
            alert("The entered email does not belong to an existing user.");
          }
        })
        .catch(error => {
          console.error("Error checking user existence:", error);
          alert("Error checking user existence: " + error.message);
        });
    });

    document.getElementById('friend-requests-btn').addEventListener('click', () => {
      sidebar.classList.remove('open');
      mainContent.classList.remove('dimmed');
      loadFriendRequests();
      document.getElementById('requests-container').style.display = 'block';
      modalOverlay.classList.add('active');
    });

    document.getElementById('close-requests').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('requests-container').style.display = 'none';
      modalOverlay.classList.remove('active');
    });

    function loadFriendRequests() {
      const requestList = document.getElementById('request-list');
      requestList.innerHTML = "";
      db.collection("friendRequests")
        .where("recipient", "==", currentUsername)
        .where("status", "==", "pending")
        .orderBy("timestamp")
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            requestList.innerHTML = "<li>No friend requests</li>";
          } else {
            let promises = [];
            snapshot.forEach(doc => {
              const req = doc.data();
              let p = db.collection("users").doc(req.sender).get()
                .then(friendDoc => {
                  const friendName = friendDoc.exists && friendDoc.data().name 
                                      ? friendDoc.data().name 
                                      : req.sender;
                  return { id: doc.id, sender: req.sender, senderName: friendName };
                });
              promises.push(p);
            });
            Promise.all(promises)
              .then(results => {
                results.forEach(request => {
                  const li = document.createElement('li');
                  li.textContent = request.senderName;
                  const acceptBtn = document.createElement('button');
                  acceptBtn.textContent = "Accept";
                  acceptBtn.addEventListener('click', () => {
                    acceptFriendRequest(request.id, request.sender);
                  });
                  const rejectBtn = document.createElement('button');
                  rejectBtn.textContent = "Reject";
                  rejectBtn.addEventListener('click', () => {
                    rejectFriendRequest(request.id);
                  });
                  li.appendChild(acceptBtn);
                  li.appendChild(rejectBtn);
                  requestList.appendChild(li);
                });
              })
              .catch(error => console.error("Error loading friend request names:", error));
          }
        })
        .catch(error => console.error("Error loading friend requests:", error));
    }

    function acceptFriendRequest(requestId, senderEmail) {
      const currentUserRef = db.collection("users").doc(currentUsername);
      const senderRef = db.collection("users").doc(senderEmail);
      const requestRef = db.collection("friendRequests").doc(requestId);

      const batch = db.batch();
      batch.update(currentUserRef, { friends: firebase.firestore.FieldValue.arrayUnion(senderEmail) });
      batch.update(senderRef, { friends: firebase.firestore.FieldValue.arrayUnion(currentUsername) });
      batch.update(requestRef, { status: "accepted" });

      batch.commit()
        .then(() => {
          alert("Friend request accepted!");
          loadFriendRequests();
          loadFriendsList(currentUsername);
        })
        .catch(error => {
          console.error("Error accepting friend request:", error);
          alert("Error accepting friend request: " + error.message);
        });
    }

    function rejectFriendRequest(requestId) {
      db.collection("friendRequests").doc(requestId).update({ status: "rejected" })
      .then(() => {
        alert("Friend request rejected.");
        loadFriendRequests();
      })
      .catch(error => {
        console.error("Error rejecting friend request:", error);
        alert("Error rejecting friend request: " + error.message);
      });
    }

    document.getElementById('game-requests-btn').addEventListener('click', () => {
      sidebar.classList.remove('open');
      mainContent.classList.remove('dimmed');
      loadGameRequests();
      document.getElementById('game-requests-container').style.display = 'block';
      modalOverlay.classList.add('active');
    });

    document.getElementById('close-game-requests').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('game-requests-container').style.display = 'none';
      modalOverlay.classList.remove('active');
    });

    function loadGameRequests() {
      const gameRequestList = document.getElementById('game-request-list');
      gameRequestList.innerHTML = "";
      db.collection("gameRequests")
        .where("recipient", "==", currentUsername)
        .where("recipientAccepted", "==", false)
        .where("status", "==", "pending")
        .orderBy("timestamp")
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            gameRequestList.innerHTML = "<li>No game requests</li>";
          } else {
            let promises = [];
            snapshot.forEach(doc => {
              const req = doc.data();
              let p = db.collection("users").doc(req.sender).get()
                .then(friendDoc => {
                  const friendName = friendDoc.exists && friendDoc.data().name 
                                      ? friendDoc.data().name 
                                      : req.sender;
                  return {
                    requestDocId: doc.id,
                    sender: req.sender,
                    senderName: friendName,
                    gameType: req.gameType
                  };
                });
              promises.push(p);
            });
            Promise.all(promises)
              .then(results => {
                results.forEach(request => {
                  const li = document.createElement('li');
                  li.textContent = `${request.senderName} challenged you to play ${request.gameType}`;
                  const acceptBtn = document.createElement('button');
                  acceptBtn.textContent = "Accept";
                  acceptBtn.addEventListener('click', () => {
                    acceptGameRequest(request.requestDocId, request.sender, request.gameType);
                  });
                  const rejectBtn = document.createElement('button');
                  rejectBtn.textContent = "Reject";
                  rejectBtn.addEventListener('click', () => {
                    rejectGameRequest(request.requestDocId);
                  });
                  li.appendChild(acceptBtn);
                  li.appendChild(rejectBtn);
                  gameRequestList.appendChild(li);
                });
              })
              .catch(error => console.error("Error loading game request names:", error));
          }
        })
        .catch(error => console.error("Error loading game requests:", error));
    }

    function acceptGameRequest(requestId, senderEmail, gameType) {
      if (!requestId) {
        console.error("No requestId found. Cannot accept game request.");
        return;
      }
      const requestRef = db.collection("gameRequests").doc(requestId);
      requestRef.update({ recipientAccepted: true })
        .then(() => {
          requestRef.get().then(doc => {
            const data = doc.data();
            if (data && data.senderAccepted && data.recipientAccepted) {
              alert("Game request accepted! Redirecting to game match...");
              if (data.sender === currentUsername) {
                sessionStorage.setItem("myColor", "white");
              } else {
                sessionStorage.setItem("myColor", "black");
              }
              sessionStorage.setItem("roomId", requestId);
              window.location.href = data.gameType === "Chess" ? "chess_game.html" : "pingpong_game.html";
            }
          });
        })
        .catch(error => {
          console.error("Error accepting game request:", error);
          alert("Error accepting game request: " + error.message);
        });
    }

    function rejectGameRequest(requestId) {
      db.collection("gameRequests").doc(requestId).update({ status: "rejected" })
      .then(() => {
        alert("Game request rejected.");
        loadGameRequests();
      })
      .catch(error => {
        console.error("Error rejecting game request:", error);
        alert("Error rejecting game request: " + error.message);
      });
    }

    document.getElementById('challenge').addEventListener('click', () => {
      document.getElementById('game-select-modal').style.display = 'block';
      modalOverlay.classList.add('active');
    });

    document.querySelectorAll('.game-option').forEach(button => {
      button.addEventListener('click', function() {
        const selectedGame = this.getAttribute('data-game');
        sendGameRequest(selectedGame);
        document.getElementById('game-select-modal').style.display = 'none';
        modalOverlay.classList.remove('active');
      });
    });

    document.getElementById('cancel-game-select').addEventListener('click', () => {
      document.getElementById('game-select-modal').style.display = 'none';
      modalOverlay.classList.remove('active');
    });

    function sendGameRequest(gameType) {
      if (!targetUser) {
        alert("Please select a chat before challenging.");
        return;
      }
      db.collection("gameRequests").add({
        sender: currentUsername,
        recipient: targetUser,
        senderAccepted: true,
        recipientAccepted: false,
        status: "pending",
        gameType: gameType,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then((docRef) => {
        if (!docRef.id) {
          console.error("docRef returned no ID. Something went wrong.");
          return;
        }
        alert("Game challenge sent! Waiting for acceptance...");
        sessionStorage.setItem("myColor", "white");
        sessionStorage.setItem("roomId", docRef.id);
        listenToOutgoingGameRequest(docRef.id, gameType);
      })
      .catch(error => {
        console.error("Error sending game challenge:", error);
        alert("Error sending game challenge: " + error.message);
      });
    }

    function listenToOutgoingGameRequest(docId, gameType) {
      db.collection("gameRequests").doc(docId)
        .onSnapshot(doc => {
          const data = doc.data();
          if (data && data.senderAccepted && data.recipientAccepted) {
            alert("Your challenge was accepted! Redirecting to game...");
            sessionStorage.setItem("roomId", docId);
            window.location.href = gameType === "Chess" ? "chess_game.html" : "pingpong_game.html";
          }
        });
    }

    document.getElementById('profile-btn').addEventListener('click', () => {
      window.location.href = 'profile.html';
    });
  </script>
</body>
</html>
