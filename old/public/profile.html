<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #282828 100%);
      color: #eee;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .profile-container {
      background-color: rgba(34, 34, 34, 0.98);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      width: 90%;
      max-width: 500px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .profile-container:hover {
      transform: translateY(-3px);
    }
    
    h1 {
      font-size: 1.6em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      text-align: left;
    }
    
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #333;
      color: #eee;
      font-size: 1em;
    }
    
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, #027a0d, #025815);
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      font-size: 1em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px auto;
      display: block;
    }
    button:hover {
      background: linear-gradient(135deg, #037c1e, #025815);
      transform: translateY(-2px);
    }
    
    #back-button {
      background: linear-gradient(135deg, #444, #333);
    }
    
    /* Mobile responsiveness */
    @media (max-width: 600px) {
      .profile-container {
        padding: 20px;
      }
      h1 {
        font-size: 1.4em;
      }
      input, button {
        font-size: 0.9em;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h1>Profile</h1>
    <form id="profile-form">
      <label for="profile-name">Name:</label>
      <input type="text" id="profile-name" name="profile-name" required>
      <label for="profile-email">Email:</label>
      <input type="email" id="profile-email" name="profile-email" readonly>
      <button type="submit">Update Profile</button>
    </form>
    <button id="back-button">Back</button>
  </div>

  <script>
    // Firebase configuration
     firebase.initializeApp(firebaseConfig);
    firebase.analytics();


    document.addEventListener('DOMContentLoaded', () => {
      const username = sessionStorage.getItem('username');
      const token = sessionStorage.getItem('token');
      if (!username || !token) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('profile-email').value = username;
        db.collection("users").doc(username).get()
          .then(doc => {
            if (doc.exists) {
              const data = doc.data();
              document.getElementById('profile-name').value = data.name || "";
            } else {
              console.error("No profile data found for", username);
            }
          })
          .catch(error => console.error("Error loading profile:", error));
      }
    });

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = sessionStorage.getItem('username');
      const newName = document.getElementById('profile-name').value.trim();
      if (!newName) {
        alert("Name cannot be empty.");
        return;
      }
      db.collection("users").doc(username).update({
        name: newName
      })
      .then(() => {
        alert("Profile updated successfully!");
      })
      .catch(error => {
        console.error("Error updating profile:", error);
        alert("Error updating profile: " + error.message);
      });
    });

    document.getElementById('back-button').addEventListener('click', () => {
      window.location.href = 'homescreen.html';
    });
  </script>
</body>
</html>
